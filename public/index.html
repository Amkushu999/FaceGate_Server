<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FaceDocs — Login</title>
<meta name="description" content="FaceDocs Secure Access — facedocs.bond"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c14;--card:#111827;--border:#1f2937;--accent:#3b82f6;--text:#e5e7eb;--muted:#9ca3af;--green:#22c55e}
html,body{height:100%}
body{
  font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background:#080c14;
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
}
/* subtle grid + vignette like the reference image */
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(1000px 600px at 50% -10%, #1e293b33, transparent 60%),
    radial-gradient(800px 600px at 50% 110%, #0f172a66, transparent 60%),
    linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:auto, auto, 100% 32px;
  pointer-events:none;
}
a{color:#60a5fa;text-decoration:none}
a:hover{text-decoration:underline}

.wrap{
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
  position:relative;
  z-index:1;
}

/* Logo card - mimics the splash image */
.logo-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:18px;
  position:relative;
}
.logo-img{
  width:100%;
  max-width:360px;
  height:auto;
  display:block;
  border-radius:18px;
  background:#0a0a0a;
  border:1px solid #1f2937;
  box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04) inset;
}
@media(max-width:480px){ .logo-img{max-width:300px} }

/* Login card */
.card{
  width:100%;
  background:rgba(17,24,39,0.85);
  backdrop-filter:blur(12px);
  border:1px solid #1f2a3a;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.card-head{
  text-align:center;
  margin-bottom:16px;
}
.card-head h1{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.01em;
  color:#f3f4f6;
}
.card-head p{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
  line-height:1.4;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:14px;
}
.field label{
  font-size:12px;
  font-weight:600;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:#cbd5e1;
}
.input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.input{
  width:100%;
  background:#0b1220;
  border:1px solid #1e2d4a;
  color:#e5e7eb;
  padding:13px 14px 13px 40px;
  border-radius:10px;
  font-size:14px;
  outline:none;
  transition:.15s;
}
.input::placeholder{color:#64748b}
.input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15);background:#0e1a32}
.icon{
  position:absolute;
  left:12px;
  width:18px;height:18px;
  display:grid;place-items:center;
  color:#64748b;
  pointer-events:none;
}
.icon svg{width:16px;height:16px;stroke-width:1.6}

.show-btn{
  position:absolute;
  right:8px;
  background:transparent;
  border:none;
  color:#94a3b8;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  padding:6px 8px;
  border-radius:6px;
}
.show-btn:hover{color:#e2e8f0;background:rgba(255,255,255,.06)}

.btn-primary{
  width:100%;
  margin-top:18px;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  border:none;
  padding:13px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 8px 20px rgba(37,99,235,.35);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(37,99,235,.45);background:linear-gradient(135deg,#1e40af,#2563eb)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  font-size:12px;
}
.meta label{display:flex;align-items:center;gap:6px;color:#94a3b8;cursor:pointer}
.meta input[type="checkbox"]{accent-color:#2563eb;width:14px;height:14px}
.error{
  display:none;
  margin-top:12px;
  background:#7f1d1d;
  border:1px solid #991b1b;
  color:#fecaca;
  padding:10px 12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.4;
}
.success{
  display:none;
  margin-top:12px;
  background:#14532d;
  border:1px solid #166534;
  color:#bbf7d0;
  padding:10px 12px;
  border-radius:10px;
  font-size:13px;
}
.kbd{font-family:ui-monospace,monospace;font-size:10px;color:#64748b}
.status-line{
  margin-top:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:11px;
  color:#64748b;
}
.dot{width:7px;height:7px;border-radius:999px;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.15)}
.footer{
  margin-top:18px;
  text-align:center;
  color:#64748b;
  font-size:11px;
  line-height:1.5;
}
.footer a{color:#94a3b8}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-wrap">
      <!-- Provided splash_hacker.png as logo -->
      <img src="/splash_hacker.png" alt="FaceDocs" class="logo-img" onerror="this.style.display='none'"/>
    </div>

    <div class="card">
      <div class="card-head">
        <h1>Secure Access</h1>
        <p>Sign in to continue to FaceDocs<br/><span class="kbd">facedocs.bond • V4.7.8</span></p>
      </div>

      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="field">
          <label for="user">Username</label>
          <div class="input-wrap">
            <span class="icon">
              <!-- user icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-6 8-6s8 2 8 6"/></svg>
            </span>
            <input id="user" class="input" type="text" placeholder="admin" autocomplete="username" value="admin" required/>
          </div>
        </div>

        <div class="field">
          <label for="pass">Password</label>
          <div class="input-wrap">
            <span class="icon">
              <!-- lock icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1.5"/></svg>
            </span>
            <input id="pass" class="input" type="password" placeholder="••••••••" autocomplete="current-password" required/>
            <button type="button" class="show-btn" onclick="togglePass()">Show</button>
          </div>
        </div>

        <div class="meta">
          <label><input type="checkbox" id="remember" checked/> Remember me</label>
          <a href="#" onclick="event.preventDefault(); toast('Contact admin to reset.')">Forgot?</a>
        </div>

        <div id="err" class="error"></div>
        <div id="ok" class="success"></div>

        <button id="submitBtn" class="btn-primary" type="submit">Sign In →</button>
      </form>

      <div class="status-line">
        <span class="dot" id="dot"></span>
        <span id="statusTxt">Checking API…</span>
        <span class="kbd" style="margin-left:auto">82.25.90.196</span>
      </div>
    </div>

    <div class="footer">
      © 2026 FaceDocs • <a href="/api/health" target="_blank">API health</a> • <a href="/admin.html">Admin</a><br/>
      <span class="kbd">HMAC secured • facedocs.bond</span>
    </div>
  </div>

<div id="toast" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #1f2937;color:#e5e7eb;padding:10px 14px;border-radius:10px;display:none;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.4);font-size:13px"></div>

<script>
function toast(msg, ok=true){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block'; t.style.borderColor= ok?'#166534':'#991b1b';
  setTimeout(()=>t.style.display='none',3000);
}
function togglePass(){
  const p=document.getElementById('pass');
  const b=document.querySelector('.show-btn');
  if(p.type==='password'){ p.type='text'; b.textContent='Hide'; }
  else { p.type='password'; b.textContent='Show'; }
}
async function checkHealth(){
  const el=document.getElementById('statusTxt');
  const dot=document.getElementById('dot');
  try{
    const r=await fetch('/api/health');
    const j=await r.json();
    if(j.ok){ el.textContent='API Online • '+ (j.stats? j.stats.activeKeys+' keys ' : ''); dot.style.background='#22c55e'; dot.style.boxShadow='0 0 0 4px rgba(34,197,94,.15)'; }
    else { el.textContent='API Error'; dot.style.background='#ef4444'; }
  }catch{
    el.textContent='Offline'; dot.style.background='#ef4444';
  }
}
checkHealth(); setInterval(checkHealth,15000);

async function doLogin(e){
  e.preventDefault();
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value;
  const btn=document.getElementById('submitBtn');
  const err=document.getElementById('err');
  const ok=document.getElementById('ok');
  err.style.display='none'; ok.style.display='none';
  if(!u||!p){ err.textContent='Username and password required.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Signing in…';
  try{
    const r=await fetch('/admin/login',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:u, pass:p})});
    const j=await r.json();
    if(j.ok){
      localStorage.setItem('fd_token', j.token);
      localStorage.setItem('fd_creds', btoa(u+':'+p));
      if(document.getElementById('remember').checked){
        // keep
      } else {
        // session only — handled by same storage for now
      }
      ok.textContent='Access granted — redirecting…';
      ok.style.display='block';
      toast('Welcome, '+u+' ✓');
      setTimeout(()=>{ window.location.href='/admin.html'; },700);
    } else {
      err.textContent=j.message||'Invalid credentials'; err.style.display='block';
      toast('Login failed', false);
    }
  }catch(ex){
    err.textContent='Network error: '+ex.message; err.style.display='block';
  } finally {
    btn.disabled=false; btn.textContent='Sign In →';
  }
}
// auto-fill if already logged in? just show hint
window.addEventListener('load',()=>{
  const creds=localStorage.getItem('fd_creds');
  if(creds){
    try{
      const u=atob(creds).split(':')[0];
      if(u) document.getElementById('user').value=u;
    }catch{}
  }
});
</script>
</body>
</html>
