# nginx.conf — facedocs.bond → Node on 3000, with SSL via Certbot
# VPS: 82.25.90.196  (IPv6 2a02:4780:2d:4fec::1)
# Put this file to /etc/nginx/sites-available/facedocs.bond then link to sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name facedocs.bond www.facedocs.bond;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all http to https (after cert obtained)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name facedocs.bond www.facedocs.bond;

    # Certbot will fill these after: sudo certbot --nginx -d facedocs.bond -d www.facedocs.bond
    ssl_certificate     /etc/letsencrypt/live/facedocs.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facedocs.bond/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy to Node
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # optional: cache static
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        proxy_pass http://127.0.0.1:3000;
    }

    access_log /var/log/nginx/facedocs.bond.access.log;
    error_log  /var/log/nginx/facedocs.bond.error.log;
}

